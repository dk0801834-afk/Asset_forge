version: "3.9"

services:
  # PostgreSQL database (optional; SQLite is used by default for zero-infra deployment)
  # Uncomment the db service and set DATABASE_URL=postgresql://assetforge:assetforge@db:5432/assetforge
  # in backend/.env to use Postgres.
  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: assetforge
  #     POSTGRES_PASSWORD: assetforge
  #     POSTGRES_DB: assetforge
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U assetforge"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Default to SQLite for zero-cost deployment. Override with Postgres if desired.
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/assetforge.db}
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-long-random-string-in-production}
    volumes:
      - backend_data:/app/data
      # Optional: mount .env for development
      # - ./backend/.env:/app/.env
    ports:
      - "8000:8000"
    # Uncomment when using Postgres:
    # depends_on:
    #   db:
    #     condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  backend_data:
  # postgres_data:
